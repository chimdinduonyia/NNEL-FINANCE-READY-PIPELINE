<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management | NNEL Pipeline Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-content">

  <main class="container page-main">
    <div class="flex items-center justify-between" style="margin-bottom:24px;">
      <div>
        <h1 style="font-size:24px;font-weight:800;">User Management</h1>
        <p class="text-muted text-sm mt-4">Manage accounts and system-level roles.</p>
      </div>
      <button class="btn btn-primary" id="new-user-btn">+ New User</button>
    </div>

    <label class="flex items-center gap-8 text-sm text-muted" style="margin-bottom:12px;cursor:pointer;">
      <input type="checkbox" id="show-deleted-toggle" style="width:auto;">
      Show deleted users
    </label>

    <div class="card" id="users-card">
      <div class="loading">Loading users…</div>
    </div>
  </main>

  <!-- New / Edit user modal -->
  <div id="user-modal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;">
    <div class="card" style="width:100%;max-width:480px;">
      <div class="card-header">
        <h3 id="modal-title">New User</h3>
        <button class="btn btn-ghost btn-sm" id="modal-close-btn">✕</button>
      </div>
      <div class="card-body">
        <form id="user-form" style="display:flex;flex-direction:column;gap:18px;">
          <input type="hidden" id="edit-user-id">
          <div class="form-group">
            <label for="u-name">Full name *</label>
            <input type="text" id="u-name" required placeholder="e.g. Adaeze Obi">
          </div>
          <div class="form-group">
            <label for="u-email">Email address *</label>
            <input type="email" id="u-email" required placeholder="adaeze@nnel.com">
          </div>
          <div class="form-group" id="password-group">
            <label for="u-password">Password * <span class="form-hint">(minimum 12 characters)</span></label>
            <div class="pw-wrap">
              <input type="password" id="u-password" autocomplete="new-password" placeholder="••••••••••••">
              <button type="button" class="pw-toggle" data-target="u-password">Show</button>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="u-role">System role *</label>
              <select id="u-role" required>
                <option value="user">User (project-level roles only)</option>
                <option value="project_manager">Project Manager (create projects, manage templates)</option>
                <option value="admin">Admin (system-wide access)</option>
              </select>
            </div>
            <div class="form-group">
              <label for="u-workstream">Workstream</label>
              <select id="u-workstream">
                <option value="">None</option>
                <option value="technical">Technical</option>
                <option value="commercial">Commercial</option>
                <option value="finance">Finance</option>
                <option value="legal">Legal</option>
                <option value="risk">Risk</option>
                <option value="esg">ESG</option>
                <option value="administrative">Administrative</option>
                <option value="external">External</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="u-authority">Authority level</label>
            <select id="u-authority">
              <option value="ss">SS: Senior Staff (default)</option>
              <option value="external">External</option>
              <option value="m6_dm">M6: DM</option>
              <option value="m5_manager">M5: Manager</option>
              <option value="m4_ed_cam">M4: ED-CAM</option>
              <option value="slt_mtc">SLT-MTC</option>
              <option value="m3_md_nnel">M3: MD-NNEL</option>
              <option value="nnel_board">NNEL Board</option>
              <option value="m2_evp">M2: EVP</option>
              <option value="m1_nnpc">M1: NNPC Group</option>
            </select>
          </div>
          <div id="modal-error" class="error-msg hidden"></div>
          <div class="flex gap-8" style="justify-content:flex-end;">
            <button type="button" class="btn btn-ghost" id="modal-cancel-btn">Cancel</button>
            <button type="submit" class="btn btn-primary" id="modal-submit-btn">Create User</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Reset password modal -->
  <div id="pw-modal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;">
    <div class="card" style="width:100%;max-width:420px;">
      <div class="card-header">
        <h3>Reset Password</h3>
        <button class="btn btn-ghost btn-sm" id="pw-modal-close">✕</button>
      </div>
      <div class="card-body">
        <form id="pw-form" style="display:flex;flex-direction:column;gap:18px;">
          <input type="hidden" id="pw-user-id">
          <p class="text-sm text-muted" id="pw-modal-desc"></p>
          <div class="form-group">
            <label for="pw-new">New password * <span class="form-hint">(minimum 12 characters)</span></label>
            <div class="pw-wrap">
              <input type="password" id="pw-new" autocomplete="new-password" required placeholder="••••••••••••">
              <button type="button" class="pw-toggle" data-target="pw-new">Show</button>
            </div>
          </div>
          <div id="pw-error" class="error-msg hidden"></div>
          <div class="flex gap-8" style="justify-content:flex-end;">
            <button type="button" class="btn btn-ghost" id="pw-cancel-btn">Cancel</button>
            <button type="submit" class="btn btn-primary">Set Password</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/users.js"></script>

    </div>
  </div>
</body>
</html>
