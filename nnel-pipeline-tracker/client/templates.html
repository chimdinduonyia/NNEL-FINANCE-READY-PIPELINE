<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Template Editor | NNEL Pipeline Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .template-tabs { display:flex; gap:0; border-bottom:2px solid var(--border); margin-bottom:0; }
    .template-tab {
      padding:12px 24px; font-size:14px; font-weight:600; color:var(--text-muted);
      background:none; border:none; border-bottom:2px solid transparent; margin-bottom:-2px;
      cursor:pointer; font-family:inherit; transition:color .15s;
    }
    .template-tab:hover { color:var(--gray-700); }
    .template-tab.active { color:var(--green-700); border-bottom-color:var(--green-700); }

    .version-banner {
      display:flex; align-items:center; gap:12px; flex-wrap:wrap;
      padding:12px 16px; border-radius:var(--radius); margin-bottom:20px;
      font-size:13px;
    }
    .version-banner.warn { background:var(--amber-100); border:1px solid #fde68a; color:var(--amber-600); }
    .version-banner.safe { background:var(--green-50); border:1px solid var(--green-100); color:var(--green-700); }
    .version-banner.draft { background:var(--gray-100); border:1px dashed var(--gray-200); color:var(--gray-700); }
    .version-banner strong { font-weight:700; }

    .version-history-group-heading {
      padding:8px 14px 4px; font-size:11px; font-weight:700; color:var(--text-muted);
      text-transform:uppercase; letter-spacing:.04em; background:var(--gray-50);
      border-bottom:1px solid var(--border);
    }

    .stage-section { margin-bottom:24px; }
    .stage-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 16px; background:var(--gray-50); border:1px solid var(--border);
      border-radius:var(--radius); cursor:pointer; user-select:none;
    }
    .stage-header h3 { font-size:14px; font-weight:700; color:var(--gray-900); }
    .stage-header .stage-count { font-size:12px; color:var(--text-muted); }
    .stage-body { border:1px solid var(--border); border-top:none; border-radius:0 0 var(--radius) var(--radius); overflow:hidden; }

    .item-row {
      display:grid;
      grid-template-columns: 34px 100px 1fr 90px 68px 96px;
      gap:8px; align-items:center;
      padding:10px 12px;
      border-bottom:1px solid var(--border);
      font-size:13px;
    }
    .item-row:last-of-type { border-bottom:none; }
    .item-row.inactive { opacity:0.45; background:var(--gray-50); }
    .item-row.editing  { background:var(--green-50); }
    .item-code  { font-weight:700; font-family:monospace; font-size:12px; }
    .item-desc  { color:var(--gray-900); }
    .item-actions { display:flex; gap:2px; justify-content:flex-end; }

    .item-row input[type=text], .item-row textarea, .item-row select {
      font-size:12px; padding:4px 8px;
    }
    .item-row textarea { min-height:48px; resize:vertical; }

    .collapsible-panel { margin-top:10px; }
    .collapsible-toggle:hover { background:var(--gray-100) !important; }
    .add-item-panel {
      padding:14px 16px; background:var(--gray-50);
      border:1px solid var(--border);
      border-radius:0 0 var(--radius) var(--radius);
    }
    .add-item-grid { display:grid; grid-template-columns:1fr 120px 80px; gap:8px; align-items:end; }
    .gate-chain-config {
      padding:14px 16px; background:var(--blue-100); border:1px solid #93c5fd;
      border-radius:0 0 var(--radius) var(--radius);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-content">

  <main class="container page-main">
    <div class="flex items-center justify-between" style="margin-bottom:20px;">
      <div>
        <h1 style="font-size:24px;font-weight:800;">Template Editor</h1>
        <p class="text-muted text-sm mt-4">Manage the FRP checklist templates for each project vertical.</p>
      </div>
      <div id="editor-header-actions"></div>
    </div>

    <!-- Technology tabs -->
    <div class="card" style="overflow:visible;">
      <div style="border-bottom:2px solid var(--border);">
        <div class="template-tabs" id="tech-tabs">
          <button class="template-tab active" data-tech="solar_pv">Solar PV</button>
          <button class="template-tab" data-tech="biofuels">Biofuels</button>
          <button class="template-tab" data-tech="abatement">Abatement</button>
        </div>
      </div>
      <div class="card-body">
        <div id="template-content">
          <div class="loading">Loading template…</div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/templates.js"></script>

    </div>
  </div>
</body>
</html>
