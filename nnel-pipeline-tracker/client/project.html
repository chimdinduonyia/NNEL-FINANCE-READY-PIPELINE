<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project | NNEL Pipeline Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <header id="app-header">
    <div class="container header-inner">
      <a href="/" class="back-link">← Portfolio</a>
      <div class="logo">
        <img src="/img/nnel-logo-light.png" alt="NNEL" class="header-logo">
        <span class="logo-text">Finance-Ready Pipeline Tracker</span>
      </div>
      <div class="header-user" id="header-user">
        <div class="user-menu">
          <span class="user-menu-name" id="user-name"></span>
          <div class="avatar-wrapper">
            <div class="avatar" id="user-avatar"></div>
            <div class="avatar-dropdown" id="avatar-dropdown"></div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Project name + meta bar -->
  <div class="project-header-bar" id="project-header" style="display:none;">
    <div class="container">
      <div class="project-title-row">
        <div>
          <h1 class="project-name" id="project-name"></h1>
          <div class="project-meta" id="project-meta"></div>
        </div>
        <div id="project-actions"></div>
      </div>
    </div>
  </div>

  <!-- Project brief -->
  <div class="project-brief" id="project-brief" style="display:none;">
    <div class="container">
      <div class="brief-grid" id="brief-grid"></div>
    </div>
  </div>

  <!-- Pipeline stage strip -->
  <div class="pipeline-strip" id="pipeline-strip" style="display:none;">
    <div class="container">
      <div class="stage-strip" id="stage-strip"></div>
    </div>
  </div>

  <!-- Section tabs -->
  <div style="background:var(--bg);border-bottom:1px solid var(--border);" id="tabs-bar" style="display:none;">
    <div class="container" style="padding-top:0;padding-bottom:0;">
      <nav class="section-tabs" id="section-tabs"></nav>
    </div>
  </div>

  <!-- Section content -->
  <main class="container section-content" id="section-content">
    <div class="loading">Loading project…</div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/project.js"></script>
</body>
</html>
