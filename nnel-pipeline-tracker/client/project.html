<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project | NNEL Pipeline Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-content">

  <!-- Project name + meta bar -->
  <div class="project-header-bar" id="project-header" style="display:none;">
    <div class="container">
      <div class="project-title-row">
        <div>
          <h1 class="project-name" id="project-name"></h1>
          <div class="project-meta" id="project-meta"></div>
        </div>
        <div class="flex items-center gap-12">
          <div id="project-presence-stack"></div>
          <div id="project-actions"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Project brief -->
  <div class="project-brief" id="project-brief" style="display:none;">
    <div class="container">
      <div class="brief-grid" id="brief-grid"></div>
    </div>
  </div>

  <!-- Pipeline stage strip -->
  <div class="pipeline-strip" id="pipeline-strip" style="display:none;">
    <div class="container">
      <div class="stage-strip-wrap">
        <button type="button" class="stage-nav-btn hidden" id="stage-nav-left" title="Show earlier stages" aria-label="Show earlier stages">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><polyline points="8.5,2.5 3.5,7 8.5,11.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter"/></svg>
        </button>
        <div class="stage-strip-viewport">
          <div class="stage-strip" id="stage-strip"></div>
        </div>
        <button type="button" class="stage-nav-btn hidden" id="stage-nav-right" title="Show later stages" aria-label="Show later stages">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><polyline points="4,2.5 9,7 4,11.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter"/><polyline points="8,2.5 13,7 8,11.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Section tabs -->
  <div style="background:var(--bg);border-bottom:1px solid var(--border);" id="tabs-bar" style="display:none;">
    <div class="container" style="padding-top:0;padding-bottom:0;">
      <nav class="section-tabs" id="section-tabs"></nav>
    </div>
  </div>

  <!-- Shown instead of a silent live-refresh when the user has unsaved
       input in the current tab (gate decision form / Team tab edits), so a
       change from someone else never quietly discards what they're typing. -->
  <div class="container" style="padding-bottom:0;">
    <div id="live-update-banner" class="hidden" style="display:flex;align-items:center;gap:10px;padding:10px 16px;margin-top:16px;background:var(--gray-50);border:1px solid var(--border);border-radius:var(--radius);font-size:13px;">
      <span style="flex:1;">This project was updated elsewhere. Finish or discard your changes, then refresh to see the latest.</span>
      <button type="button" class="btn btn-ghost btn-sm" id="live-update-refresh-btn">Refresh now</button>
    </div>
  </div>

  <!-- Section content -->
  <main class="container section-content" id="section-content">
    <div class="loading">Loading project…</div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/live.js"></script>
  <script src="/js/project.js"></script>

    </div>
  </div>
</body>
</html>
