<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internal Memo | NNEL Pipeline Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Urbanist', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: #1a1a1a;
      background: #d8d8d8;
      padding: 32px 16px 56px;
    }

    /* ---- Print button (hidden on print) ---- */
    .print-bar {
      max-width: 794px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .print-bar p { font-size: 12px; color: #555; }
    .print-btn {
      padding: 9px 24px;
      background: #1B5E20;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .print-btn:hover { background: #2E7D32; }

    /* ---- Memo document ---- */
    .memo {
      background: #fff;
      max-width: 794px;
      margin: 0 auto;
      padding: 48px 60px 40px;
      box-shadow: 0 4px 28px rgba(0,0,0,0.14);
    }

    /* ---- Header: logo left, title block right ---- */
    .memo-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 3px solid #1B5E20;
    }
    .memo-logo img { height: 56px; width: auto; display: block; }
    .memo-title-block { text-align: right; }
    .memo-title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #1B5E20;
      line-height: 1;
      margin-bottom: 6px;
    }
    .memo-date-line { font-size: 12px; color: #555; margin-bottom: 3px; }
    .memo-ref-line  { font-size: 11px; color: #999; }

    /* ---- Address block (To / From / Subject) ---- */
    .memo-address {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid #ddd;
    }
    .memo-address-table { width: 100%; border-collapse: collapse; }
    .memo-address-table tr { vertical-align: bottom; }
    .memo-address-table td { padding: 5px 0; }
    .addr-label {
      width: 88px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #666;
      padding-right: 12px;
      white-space: nowrap;
    }
    .addr-static { font-size: 14px; color: #1a1a1a; padding-bottom: 2px; }
    .addr-confidential {
      margin-top: 12px;
      font-size: 11px;
      font-weight: 700;
      color: #c62828;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* ---- Editable field: underlined input style ---- */
    .memo-input {
      display: block;
      width: 100%;
      border: none;
      border-bottom: 1px solid #aaa;
      outline: none;
      font-family: 'Urbanist', sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      background: transparent;
      padding: 2px 2px 3px;
      border-radius: 0;
    }
    .memo-input::placeholder { color: #bbb; }
    .memo-input:focus { border-bottom-color: #1B5E20; }

    /* Multi-line textarea — same underline feel */
    .memo-textarea {
      display: block;
      width: 100%;
      border: none;
      border-left: 3px solid #e0e0e0;
      outline: none;
      font-family: 'Urbanist', sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      background: #fafafa;
      padding: 8px 12px;
      border-radius: 0;
      resize: vertical;
      min-height: 90px;
      line-height: 1.6;
    }
    .memo-textarea::placeholder { color: #bbb; }
    .memo-textarea:focus { border-left-color: #1B5E20; outline: none; }

    /* ---- Sections ---- */
    .memo-section { margin-bottom: 26px; }
    .memo-section h2 {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #1B5E20;
      border-bottom: 1px solid #c8e6c9;
      padding-bottom: 4px;
      margin-bottom: 10px;
    }

    /* ---- Tables ---- */
    .memo-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .memo-table th {
      background: #f5f5f5;
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; color: #555;
      padding: 6px 10px; text-align: left;
      border-bottom: 2px solid #ddd;
    }
    .memo-table td { padding: 6px 10px; border-bottom: 1px solid #eee; vertical-align: top; }
    .memo-table tr:last-child td { border-bottom: none; }

    /* ---- Status badges ---- */
    .status { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 11px; font-weight: 700; }
    .status-approved    { background: #e8f5e9; color: #2e7d32; }
    .status-in_progress { background: #e3f2fd; color: #1565c0; }
    .status-submitted   { background: #fff8e1; color: #e65100; }
    .status-not_started { background: #f5f5f5; color: #9e9e9e; }
    .status-conditional { background: #fff3e0; color: #e65100; }
    .status-rejected    { background: #ffebee; color: #c62828; }

    /* ---- Decision colours ---- */
    .decision-go          { color: #2e7d32; font-weight: 800; }
    .decision-conditional { color: #e65100; font-weight: 800; }
    .decision-no_go       { color: #c62828; font-weight: 800; }

    /* ---- Progress bar ---- */
    .pct-bar  { display: inline-block; width: 72px; height: 5px; background: #e0e0e0; border-radius: 3px; vertical-align: middle; margin-right: 5px; }
    .pct-fill { height: 100%; background: #2e7d32; border-radius: 3px; }

    /* ---- Footer ---- */
    .memo-footer {
      margin-top: 36px;
      padding-top: 10px;
      border-top: 1px solid #ddd;
      font-size: 10px;
      color: #999;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .memo-footer .confidential { font-weight: 800; color: #c62828; letter-spacing: 0.05em; }

    /* ---- Loading / error ---- */
    #memo-status { text-align: center; padding: 60px; color: #666; font-size: 15px; }

    /* ==================================================
       PRINT STYLES
       ================================================== */
    @media print {
      body { background: #fff; padding: 0; }
      .print-bar { display: none; }
      .memo { box-shadow: none; padding: 32px 48px 60px; max-width: none; }

      /* Remove all visual styling from editable fields — show content only */
      .memo-input {
        border-bottom: none;
        padding-bottom: 0;
      }
      .memo-textarea {
        border: none;
        background: transparent;
        padding: 0;
        min-height: 0;
        resize: none;
      }

      /* Repeat footer on every printed page */
      .memo-footer {
        position: fixed;
        bottom: 0;
        left: 48px;
        right: 48px;
        margin-top: 0;
        background: #fff;
        padding-top: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="print-bar" id="print-bar">
    <p>Fill in the <strong>To</strong>, <strong>Subject</strong>, and <strong>Next Steps</strong> fields before printing.</p>
    <button class="print-btn" onclick="window.print()">🖨️ Print / Save as PDF</button>
  </div>
  <div id="memo-status">Loading memo…</div>
  <div class="memo" id="memo" style="display:none;"></div>

  <script src="/js/api.js"></script>
  <script src="/js/memo.js"></script>
</body>
</html>
