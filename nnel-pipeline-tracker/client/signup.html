<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | NNEL Pipeline Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="login-page">
  <div class="login-container signup-container">
    <div class="login-header">
      <img src="/img/nnpc-logo.png" alt="NNPC New Energy" class="login-logo">
      <h1>Create Account</h1>
      <p>Join the Finance-Ready Pipeline Tracker</p>
    </div>

    <form id="signup-form" class="login-form" novalidate>
      <div class="form-group">
        <label for="full-name">Full name</label>
        <input type="text" id="full-name" autocomplete="name" required placeholder="Jane Doe">
      </div>

      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" autocomplete="email" required placeholder="you@nnel.com">
      </div>

      <div class="form-group">
        <label for="workstream">Workstream</label>
        <select id="workstream" required>
          <option value="" disabled selected>Select your workstream</option>
          <option value="technical">Technical</option>
          <option value="commercial">Commercial</option>
          <option value="finance">Finance</option>
          <option value="legal">Legal</option>
          <option value="risk">Risk</option>
          <option value="esg">ESG</option>
        </select>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" autocomplete="new-password" required placeholder="••••••••••••">
          <button type="button" class="pw-toggle" data-target="password">Show</button>
        </div>
        <ul id="pw-rules" class="pw-rules">
          <li data-rule="length">At least 12 characters</li>
          <li data-rule="letter">At least one letter</li>
          <li data-rule="number">At least one number</li>
          <li data-rule="special">At least one special character</li>
        </ul>
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm password</label>
        <div class="pw-wrap">
          <input type="password" id="confirm-password" autocomplete="new-password" required placeholder="••••••••••••">
          <button type="button" class="pw-toggle" data-target="confirm-password">Show</button>
        </div>
        <div id="pw-match" class="pw-match hidden"></div>
      </div>

      <div id="error-msg" class="error-msg hidden"></div>
      <button type="submit" id="submit-btn" class="btn btn-primary btn-full" disabled>Create Account</button>
    </form>

    <p class="login-footer-link">Already have an account? <a href="/login.html">Sign in</a></p>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/signup.js"></script>
</body>
</html>
